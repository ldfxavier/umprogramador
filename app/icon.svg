<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030f0f" />
      <stop offset="100%" stop-color="#092320" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00df82" />
      <stop offset="100%" stop-color="#03a66d" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with subtle border -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" />
  <rect width="124" height="124" x="2" y="2" rx="26" fill="none" stroke="#00df82" stroke-width="2" stroke-opacity="0.35" />

  <!-- LX Typography -->
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="52" letter-spacing="-1">
    <!-- Letter L -->
    <text x="24" y="84" fill="#fcf5f0">L</text>
    <!-- Letter X -->
    <text x="56" y="84" fill="url(#primaryGrad)" filter="url(#glow)">X</text>
    <!-- Dot . -->
    <circle cx="102" cy="81" r="5.5" fill="#00df82" filter="url(#glow)" />
  </g>
</svg>
